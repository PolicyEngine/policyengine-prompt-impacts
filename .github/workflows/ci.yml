name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Unit tests
        run: uv run --no-sync pytest -v

  country-api:
    name: Native ${{ matrix.country }} API
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [uk, us]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: Install the selected locked country environment
        run: uv sync --locked --extra dev --extra ${{ matrix.country }}
      - name: Verify installed dependencies
        run: uv pip check
      - name: Verify actual imports without population data
        run: uv run --no-sync pytest -v -m "native and ${{ matrix.country }}"
