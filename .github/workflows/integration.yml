name: Integration

# Integration tests run an actual PolicyEngine microsimulation. They are
# slow (~5–10 min) and need a HuggingFace token for the UK private dataset,
# so they are opt-in: trigger via a manual dispatch or weekly schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday

jobs:
  integration:
    name: PolicyEngine ${{ matrix.country }} integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        country: [uk, us]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install the selected locked country environment
        run: uv sync --locked --extra dev --extra ${{ matrix.country }}
      - name: Verify installed dependencies
        run: uv pip check
      - name: Verify actual imports without population data
        run: uv run --no-sync pytest -v -m "native and ${{ matrix.country }}"
      - name: Run integration tests
        env:
          HF_TOKEN: ${{ secrets.POLICYENGINE_HF_TOKEN }}
          POLICYENGINE_UK_DEFAULT_DATASET: hf://policyengine/policyengine-uk-data-private/enhanced_frs_2023_24.h5
        run: uv run --no-sync pytest -v -m "integration and ${{ matrix.country }}"
