[project]
name = "policyengine-prompt-impacts"
version = "0.1.0"
description = "Compute distributional impacts for the typewriter prompts on the PolicyEngine homepage."
authors = [
    { name = "Max Ghenis", email = "max@policyengine.org" },
]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
us = ["policyengine-us>=1.667.0", "policyengine-core>=3.25.0"]
uk = ["policyengine-uk>=2.88.0", "policyengine-core>=3.25.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
policyengine-prompt-impacts = "policyengine_prompt_impacts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyengine_prompt_impacts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: actual PolicyEngine simulation; slow and needs HuggingFace data access",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
